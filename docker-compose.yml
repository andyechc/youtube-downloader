services:
  yt-downloader:
    build: .
    image: yt-downloader:latest
    container_name: yt-downloader
    ports:
      - "${PORT:-8000}:8000"
    environment:
      YT_OUT_DIR: /downloads
    volumes:
      # Tus descargas quedan en ./downloads (persistente)
      - ./downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: yt-nginx
    depends_on:
      yt-downloader:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      NGINX_DOMAIN: ${NGINX_DOMAIN:-localhost}
    volumes:
      # La imagen oficial renderiza *.template con las vars de entorno al arrancar
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
